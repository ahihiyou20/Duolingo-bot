name: Streak keeper

on:
  schedule:
    - cron: '15 1,7,14,20 * * *'
  push:
    branches:
      - main

jobs:
  login:
    runs-on: ubuntu-latest
    environment: ENCRYPTION_KEY
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack enable && pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Restore/Save State Cache
        uses: actions/cache@v4
        with:
          path: state
          # Use run_id to ensure we always save a new cache entry with the updated state
          key: state-${{ runner.os }}-${{ github.run_id }}
          # Restore from the most recent cache with this prefix
          restore-keys: |
            state-${{ runner.os }}-

      - name: Check ENCRYPTION_KEY secret
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "::error::ENCRYPTION_KEY secret is empty. Add it under Settings > Environments > ENCRYPTION_KEY > Environment secrets, or as a Repository secret (not Codespaces or Dependabot)."
            exit 1
          fi
          echo "ENCRYPTION_KEY is set (length: ${#ENCRYPTION_KEY})"

      - name: Run Practice
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PRACTICE_LANGUAGE: Chinese
          HEADLESS: true
        run: pnpm practice
